<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treks</title>
</head>
<body>
    {% include "components/admin_header.html"%}
    <main>
        <div>
            {% if added %}
                <p style="color: green;">{{trek_name}} from {{start_location}} to {{end_location}} is added </p>
            {%elif not added %}
                <form action="/admin_dashboard/add_trek" method="post">
                    <label >Name</label>
                    <input type="text" name="name"><br>
                    <label >Maximum age </label>
                    <input type="number" name="age" ><br>
                    <label >No of slots</label>
                    <input type="number" name="slots" ><br>
                    <label >difficulty</label>
                    <select name="difficulty">
                        <option value="esay">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="difficulty">Difficulty</option>
                    </select><br>
                    <label >Start Date</label>
                    <input type="date" name="start_date"><br>
                    <label >End date</label>
                    <input type="date" name="end_date" ><br>
                    
                    <label >Starting location</label>
                    <input type="text" name="starting_location"><br>
                    <label >Ending location</label>
                    <input type="text" name="ending_location"><br>
                    <label >Asign Staff</label>
                    <select name="staff" >
                        {% for i in staff%}
                        <option value="{{i.id}}">{{i.username}}</option>
                        {%endfor%}
                    </select>
                    
                    
                    <input type="submit" value="submit">

                </form>
            {%endif%}
        </div>
    </main>
    {% include "components/footer.html"%}
</body>
</html>
