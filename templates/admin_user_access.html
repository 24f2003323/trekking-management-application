<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Admin View Uesrs Profile </title>
</head>
<body>
    {% include "components/admin_header.html"%}
    <main>
        <form action="/admin_dashboard/user_list" method="post">
            <input type="search" name="search" placeholder="Search user by username">
            <button type="submit">Search</button>
            <label >Filter:</label>
            <label style="margin-left: 3px;"> Type</label>
            <select name="type" >
                <option value="None">None</option>
                <option value="All">All</option>
                <option value="upcoming"> Actived</option>
                <option value="completed">Deactivated</option>
            </select>
            
            <button type="submit">Submit</button>
        </form>
        <div>
            <h2>Users list</h2>
            <Table border="1">
                <tr>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>DOB</th>
                    <th>Age</th>
                    <th>options</th>
                </tr>
                <tr>
                    <td>{{user.username}}</td>
                    <td>{{user.name}}</td>
                    <td>{{user.email}}</td>
                    <td>{{user.type}}</td>
                    <td>{{user.dob}}</td>
                    <td>{{user.Age}}</td>
                    <td>
                        <form action="/admin_dashboard/user_access" method="GET">
                            <button name="view_user_id" type="submit" value="{{user.id}}">View  profile</button>
                            {% if user.type =="user"%}
                            <button name="deactivate_user_id" type="submit" value="{{user.id}}"> Deactivate</button>
                            {% else%}
                            <button name="activate_user_id" type="submit" value="{{user.id}}"> Activate</button>
                            {%endif%}
                        </form>
                    </td>
                </tr>

            </Table><br>
        </div>
    </main>
    {% include "components/footer.html"%}
</body>
</html>
